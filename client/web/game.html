"use strict";
// ==================== P0 网络重写层 ====================
// 在 ruffle.js 之前安装：把 SWF 发起的官方域名请求全部改写到本地镜像
// /mirror/<host>/<path>，使整个引导链保持同源（绕开 CORS/Flash 沙箱差异）。
(function () {
  var RX = /^(https?:)?\/\/([a-z0-9.-]+)(:\d+)?(\/.*)$/i;
  function isMirrorHost(h) {
    return /(^|\.)100bt\.com$/.test(h) || /(^|\.)a0bi\.com$/.test(h) || h === "183.61.254.215";
  }
  window.__NET_STATS = { rewritten: 0, passthrough: 0, urls: [] };
  function rewrite(u) {
    try {
      if (typeof u !== "string") { return u; }
      window.__NET_STATS.urls.push(u);
      var m = u.match(RX);
      if (m && isMirrorHost(m[2].toLowerCase())) {
        window.__NET_STATS.rewritten++;
        return location.origin + "/mirror/" + m[2].toLowerCase() + m[4];
      }
      if (u.charAt(0) === "/") { return u; }        // 已是本地绝对路径
      window.__NET_STATS.passthrough++;
      return u;                                     // 相对路径交给 SWF base 解析
    } catch (e) { return u; }
  }
  // 捕获 Ruffle/AVM2 输出到面板（过滤刷屏，保留关键行）
  (function () {
  var orig = {};
  var NOISE = /RUM|ArmsEventBridge|retessellated|naga|wgpu|symphonia|graphic\.rs/;
  window.__SOCK_LINES = [];
  ["log", "info", "warn", "error"].forEach(function (lv) {
    orig[lv] = console[lv].bind(console);
    console[lv] = function () {
      var parts = Array.prototype.slice.call(arguments).map(function (x) {
        try { return typeof x === "string" ? x : JSON.stringify(x); } catch (e) { return String(x); }
      });
      var line = parts.join(" ");
      if (/ocket|onnect|ecurity|proxy/i.test(line)) {
        window.__SOCK_LINES.push("[" + new Date().toTimeString().slice(0, 8) + "] " + lv + " " + line.slice(0, 300));
        if (window.__SOCK_LINES.length > 300) { window.__SOCK_LINES.splice(0, 100); }
      }
      if (!NOISE.test(line)) { try { log(lv.toUpperCase() + " " + line); } catch (e2) {} }
      orig[lv].apply(console, arguments);
    };
  });
  })();
  var origFetch = window.fetch;
  if (origFetch) {
    window.fetch = function (input, init) {
      try {
        var desc = typeof input === "string" ? input : (input && input.url);
        var m = (init && init.method) || (input && input.method) || "GET";
        window.__LOG_LINES.push("[net] FETCH " + m + " " + desc);
        if (typeof input === "string") {
          var r = rewrite(input);
          if (r !== input) { return origFetch.call(window, r, init); }
        } else if (input && input.url) {
          var r2 = rewrite(input.url);
          if (r2 !== input.url) {
            var i = init ? Object.assign({}, init) : {};
            if (!i.method)      i.method = input.method;
            if (!i.headers && input.headers) i.headers = input.headers;
            if (i.body === undefined && input.body) i.body = input.body;
            if (!i.mode && input.mode)          i.mode = input.mode;
            if (!i.credentials && input.credentials) i.credentials = input.credentials;
            if (!i.cache && input.cache)        i.cache = input.cache;
            if (!i.integrity && input.integrity) i.integrity = input.integrity;
            if (typeof ReadableStream !== "undefined" && i.body instanceof ReadableStream) {
              i.duplex = "half";
            }
            return origFetch.call(window, r2, i);
          }
        }
      } catch (e) { try { log("fetch-patch ERR " + (e && e.stack || e)); } catch (e2) {} }
      return origFetch.call(window, input, init);
    };
  }
  // XHR 全量埋点
  (function () {
    var oo = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      try {
        arguments[1] = rewrite(url);
        this.__u = method + " " + arguments[1];
        window.__LOG_LINES.push("[net] XHR.open " + this.__u);
      } catch (e) {}
      return oo.apply(this, arguments);
    };
    var os = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function (b) {
      try {
        window.__LOG_LINES.push("[net] XHR.send " + (this.__u || "?") +
          " body=" + (b ? (b.byteLength || b.size || String(b).length) : 0));
      } catch (e) {}
      return os.apply(this, arguments);
    };
  })();
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    try { arguments[1] = rewrite(url); } catch (e) {}
    return origOpen.apply(this, arguments);
  };
})();

// ==================== ExternalInterface 宿主侧桩 ====================
// 对应 play.html + aola.js 的 JS-AS 桥（P0 先以桩承接，Phase 1 完整实现）
window.__EI_LOG = [];

  return function () {
    var a = Array.prototype.slice.call(arguments).map(String).join(",");

    log("EI<- " + name + "(" + a + ")");

      navigator.sendBeacon("/report",
        JSON.stringify({ t: new Date().toISOString(), kind: "EI", name: name, args: a }));
    } catch (e) {}
    return "";   // aola.js 侧多数返回 undefined / 字符串
  };
}

// ---- 网页登录桥（对应 aola.js 真实契约） ----
// getQS：解析当前页面 URL 参数（登录票据 u/code 由 loader 经此读取）
function qsValue(key) {
  // 注入值：loader 的自动登录页需要这批参数（真实客户端由门户/启动器 URL 提供）
  function searchValue(searchKey) {
    var search = window.location.search;
    if (!search || search === "?") { return null; }
    var kvItems = search.substring(1).split("&");
    for (var i = 0; i < kvItems.length; i++) {
      var kv = kvItems[i].split("=");
      if (decodeURIComponent(kv[0]) === searchKey) {
        return kv.length > 1 ? decodeURIComponent(kv[1]) : "";
      }
    }
    return null;
  }
  var INJECT = {
    duoduoId: "26394032",
    username: "26394032",
    location: "2",
    // 默认走启动器流；?via=web 仅用于对照 web 清单，排查世界装配卡点。
    via: searchValue("via")
  };
  if (INJECT[key] !== undefined) { return INJECT[key]; }
  var search = window.location.search;
  if (search === "" || search === "?") { return null; }
  var kvItems = search.substring(1).split("&");
  for (var i = 0; i < kvItems.length; i++) {
    var kv = kvItems[i].split("=");
    if (decodeURIComponent(kv[0]) === key) {
      return kv.length > 1 ? decodeURIComponent(kv[1]) : "";
    }
  }
  return null;
}
window.getQS = function (key) {
  var v = qsValue(key);
  log("EI<- getQS(" + key + ") => " + v);
  try {
    navigator.sendBeacon("/report", JSON.stringify(
      { t: new Date().toISOString(), kind: "EI", name: "getQS", args: key + " => " + v }));
  } catch (e) {}
  return v;
};
window.jsGetValue = function (name) {
  log("EI<- jsGetValue(" + name + ") => null");
  return null;
};
window.getCookie = function (name) {
  var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]*)"));
  var v = m ? m[1] : null;
  log("EI<- getCookie(" + name + ") => " + (v ? v.slice(0, 20) + "…" : "null"));
  return v;
};
window.getHref = function () { return window.location.href; };
window.getWindowLocationHref = function () { return window.location.href; };

// showWebLogin：loader 请求页面展示网页登录。渲染 iframe 承载官方登录页
// （经 facade 注入补丁），登录成功后回跳带票据的 game 页面 → 通知顶层换票。
window.showWebLogin = function (loginUrl) {
  log("EI<- showWebLogin(" + String(loginUrl).slice(0, 120) + "…)");
  try {
    navigator.sendBeacon("/report", JSON.stringify(
      { t: new Date().toISOString(), kind: "EI", name: "showWebLogin", args: String(loginUrl) }));
  } catch (e) {}
  var frame = document.createElement("iframe");
  frame.id = "loginFrame";
  frame.style.cssText = "position:absolute;left:0;top:0;width:960px;height:560px;" +
                        "border:0;background:#fff;z-index:9;";
  frame.src = String(loginUrl);
  var stage = document.getElementById("stage");
  stage.appendChild(frame);
  log("登录页已在 iframe 中打开，请在窗口内完成登录");
  document.title = "Aola P0 [LOGIN]";
  return "";
};

// ==================== 日志面板 ====================
var logBox = document.getElementById("log");
window.__LOG_LINES = [];
function log(msg) {
  var t = new Date().toTimeString().slice(0, 8);
  var line = "[" + t + "] " + msg;
  window.__LOG_LINES.push(line);
  if (window.__LOG_LINES.length > 800) { window.__LOG_LINES.splice(0, 200); }
  // 仅关键级别写 DOM（debug/info 高频日志只进内存数组，避免拖垮页面）
  if (/ERROR|WARN|EI<-|loading|resolved|FAILED|FATAL/.test(msg)) {
    logBox.textContent += line + "\n";
    if (logBox.textContent.length > 60000) {
      logBox.textContent = "…(trimmed)…" + logBox.textContent.slice(-40000);
    }
    logBox.scrollTop = logBox.scrollHeight;
  }
}

// ==================== 登录票据交接 ====================
// iframe 模式：登录后官方页把带票据的 game 地址装进本 iframe → 回传顶层换票
if (window.top !== window) {
  window.addEventListener("load", function () {
    try {
      if (/[?&](u|code)=/.test(window.location.search)) {
        window.parent.postMessage({ type: "aolaTicket", url: window.location.href }, "*");
        document.body.innerHTML =
          "<p style='color:#cfe3ff;padding:20px;font:14px sans-serif'>登录成功，正在进入游戏…</p>";
      }
    } catch (e) {}
  });
} else {
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "aolaTicket" && e.data.url) {
      log("收到登录票据，换票重载: " + String(e.data.url).slice(0, 120));
      window.location.replace(e.data.url);
    }
  });
}

// ==================== 登录 Cookie 组合（WebLoginData 解析格式） ====================
// user/login.swf 的 WebLoginChecker 把 game_auth_sid Cookie 按 "k=v,k=v" 解析成
// WebLoginData（duoduoId/token/gameName/gameId/autoLogin）→ Common.token 就是
// newLogin.jsp 的凭证。normallogin 返回的是裸 token，必须组合成 loader 期望的
// 格式，否则解析为空对象 → newLogin 永不触发（此前白屏的最终根因）。
(function composeAuthCookie() {
  var m = document.cookie.match(/(?:^|;\s*)game_auth_sid=([^;]*)/);
  if (!m || !m[1]) { log("无登录 Cookie —— 走 showWebLogin/验证码桥流程"); return; }
  var raw = m[1];   // 浏览器原样值，不 decode（decode 会把 %E5 解回中文，造成重载循环）
  // 服务器 Set-Cookie 下发的全量百分号编码形态（gameId%3D2%2C...）→ 解码一次为字面格式。
  // SWF 的 WebLoginChecker 按字面逗号/等号切分，编码形态解析不出 token，
  // 会把整串 Cookie 当 token 发 newLogin → <r><result>invalid</result></r>
  if (/%3D/i.test(raw) && raw.indexOf(",") < 0) {
    raw = decodeURIComponent(raw);
    document.cookie = "game_auth_sid=" + raw + "; path=/";
    log("game_auth_sid 服务器编码格式已解码为组合格式，重载生效");
    setTimeout(function () { location.reload(); }, 300);
    return;
  }
  if (/token=/.test(raw)) { log("game_auth_sid 已是组合格式，直接进入"); return; }
  if (/[^\x20-\x7e]/.test(raw)) {
    // Cookie 含非 ASCII（官方页写入的 gameName=奥拉星）——逗号+UTF-8 组合会让
    // 上游 WAF 回 500。重写为纯 ASCII 版（gameName 百分号编码；loader 只用
    // duoduoId/token，gameName 乱码无碍）。
    var fixed = raw.replace(/gameName=[^,]*/, "gameName=%E5%A5%A5%E6%8B%89%E6%98%9F");
    document.cookie = "game_auth_sid=" + fixed + "; path=/";
    log("game_auth_sid 已 ASCII 化，重载生效");
    setTimeout(function () { location.reload(); }, 300);
    return;
  }
  if (/token=/.test(raw)) { log("game_auth_sid 已是组合格式，直接进入"); return; }
  // 裸 token（normallogin Set-Cookie 原样）→ 组合为官方 WebLoginData 格式
  // （实测官方格式：gameId=2,gameName=...,duoduoId=...,token=...,autoLogin=true）
  var composed = "gameId=2,gameName=%E5%A5%A5%E6%8B%89%E6%98%9F,duoduoId=" +
                 qsValue("duoduoId") + ",token=" + raw + ",autoLogin=true";
  document.cookie = "game_auth_sid=" + composed + "; path=/";
  log("game_auth_sid 已组合为 WebLoginData 格式，重载生效");
  try { navigator.sendBeacon("/report", JSON.stringify(
    { t: new Date().toISOString(), kind: "cookieCompose", duoduoId: qsValue("duoduoId") })); } catch (e) {}
  setTimeout(function () { location.reload(); }, 300);
})();

// ==================== 登录验证码桥 ====================
// SWF 的登录请求若命中腾讯 WAF 滑块，facade 会暂存挑战参数；这里轮询领取、
// 在顶层窗口弹出滑块，通过后重放登录请求（Cookie 一致），成功即重载进游戏。
(function captchaBridge() {
  function completeCaptcha(cmd) {
    var s = document.createElement("script");
    s.src = "https://ssl.captcha.qq.com/TCaptcha.js";
    s.onload = function () {
      try {
        var cap = new TencentCaptcha(cmd.appId, function (res) {
          if (res.ret !== 0) { log("验证码未完成 ret=" + res.ret); return; }
          log("滑块验证通过，回执 WAF 并重放登录…");
          var content = [res.ret, res.ticket, res.randstr, cmd.seqid].join("\n");
          fetch("/mirror/account.100bt.com/WafCaptcha", { method: "POST", body: content })
            .then(function (r) { return r.text(); })
            .then(function (t) {
              log("WAF 回执: " + t.slice(0, 80));
              return fetch("/mirror/account.100bt.com/game/auth/normallogin.action", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: cmd.payload
              });
            })
            .then(function (r) { return r.text(); })
            .then(function (t) {
              if (/TencentCaptcha/.test(t)) {
                log("服务器仍要求验证，请再点一次游戏内登录按钮");
              } else {
                log("登录成功！正在重载进入游戏…");
                document.title = "Aola P0 [LOGIN OK]";
                setTimeout(function () { location.reload(); }, 1500);
              }
            })
            .catch(function (e) { log("验证码流程失败: " + e); });
        });
        cap.show();
      } catch (e) { log("验证码弹窗失败: " + e); }
    };
    document.head.appendChild(s);
  }
  setInterval(function () {
    fetch("/login-cmd")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.cmd === "captcha") {
          log("检测到登录滑块验证挑战 —— 请在弹窗中完成验证");
          document.title = "Aola P0 [CAPTCHA]";
          completeCaptcha(j);
        } else if (j.cmd === "setCookies" && j.cookies && j.cookies.length) {
          // 已完成的登录会话 Cookie 注入（loader 经 getCookie EI 读取）
          j.cookies.forEach(function (c) {
            try {
              document.cookie = c.name + "=" + c.value + "; path=/";
              log("注入登录 Cookie: " + c.name);
            } catch (e) {}
          });
          document.title = "Aola P0 [LOGIN OK]";
          log("登录态已注入，正在重载进入游戏…");
          try {
            navigator.sendBeacon("/report", JSON.stringify(
              { t: new Date().toISOString(), kind: "cookieInject", count: j.cookies.length }));
          } catch (e) {}
          setTimeout(function () { location.reload(); }, 1200);
        }
      })
      .catch(function () {});
  }, 2000);
})();
