        // ========== 新增全屏方法：openFullWindow ==========
        function openFullWindow(homePage) {
		try {
            // 获取SWF容器（对应页面中swfContainer div）
            var container = document.getElementById('swfContainer');
            if (!container) return;

            // 浏览器全屏API兼容处理
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.mozRequestFullScreen) { // 火狐
                container.mozRequestFullScreen();
            } else if (container.webkitRequestFullscreen) { // 谷歌/ Safari
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) { // IE/Edge
                container.msRequestFullscreen();
            }
		} catch (e) {
			console.error("开启全屏失败：", e);
			}
        }
		
		// 新增：关闭全屏方法 closeFullWindow
		function closeFullWindow() {
		try {
		// 退出全屏 兼容各浏览器
			if (document.exitFullscreen) {
			document.exitFullscreen();
			} else if (document.webkitExitFullscreen) {
			document.webkitExitFullscreen();
			} else if (document.mozCancelFullScreen) {
			document.mozCancelFullScreen();
			} else if (document.msExitFullscreen) {
			document.msExitFullscreen();
			}
			// 隐藏关闭按钮
			var closeBtn = document.getElementById("close");
			if (closeBtn) closeBtn.style.display = "none";
		} catch (e) {
			console.error("退出全屏失败：", e);
			}
		}
		
		
	</script>
